body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(160deg,rgba(8,20,42,.34),rgba(10,22,48,.22))}
#bubbles,#hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#hearts{z-index:3}
.bubble{position:absolute;border:1.5px solid rgba(255,255,255,.34);border-radius:50%;animation:float 10s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(15px) scale(.95);opacity:.3}50%{transform:translateY(-35px) scale(1.08);opacity:.75}}
main{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:22px 14px}
.screen{display:none;width:min(100%,330px);animation:appear .55s ease both}
.screen.active{display:block}
@keyframes appear{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.screen.leaving{display:block;animation:leave .4s ease forwards;pointer-events:none}
@keyframes leave{from{opacity:1}to{opacity:0;transform:scale(.4)}}
.opening{text-align:center}
button{font:600 21px var(--ff);cursor:pointer;border:0;color:#fff;background:linear-gradient(120deg,#ff8bb5,#f04d8b);padding:6px 26px;border-radius:22px;box-shadow:0 3px 10px #e84f8c55;transition:transform .15s}
button:active{transform:scale(.96)}
.card{position:relative;width:100%;padding:26px 20px 26px;text-align:center;border:2px solid transparent;border-radius:24px;
  background:linear-gradient(150deg,rgba(10,20,38,.58),rgba(12,25,47,.5)) padding-box,linear-gradient(125deg,#fff,#ff4d85 55%,#fff) border-box;
  box-shadow:0 8px 24px #0003}
.flag{position:absolute;right:16px;top:12px;font-size:20px}
.avatar{width:100px;height:100px;object-fit:cover;border-radius:50%;border:2px solid #ffffff80;background:#ffffff22;padding:3px;margin:0 auto 18px;display:block}
.question{font-size:46px;font-weight:600;margin:4px 0}
.sub{font-size:26px;font-weight:600;margin:4px 0 18px}
h1{font-size:28px;font-weight:600;margin:0 0 12px}
.calculator{max-width:270px;margin:0 auto;padding:7px;background:rgba(6,8,18,.5);border:1px solid #ffffff55;border-radius:16px}
#display{height:46px;background:rgba(0,0,0,.5);border-radius:11px;margin-bottom:7px;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;font:600 26px var(--ff);overflow:hidden;white-space:nowrap}
#display.reply{justify-content:center;font-size:21px;color:#ffd1e3}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.keys button{padding:0;height:36px;border-radius:12px;font-size:21px;background:rgba(255,111,160,.85);border:1px solid #ffffff40;box-shadow:none}
.keys .operator{background:rgba(214,98,138,.85)}
.keys .equal{background:rgba(230,20,100,.92)}
.keys .span2{grid-column:span 2}
.small-note{font-size:19px;opacity:.9;margin-top:10px}
.result-line{font-size:30px;font-weight:600;margin:6px 0 14px}
.msg{font-size:23px;font-weight:500;line-height:1.25;margin:10px 0 0}
.ln{display:block;min-height:1.25em;clip-path:inset(-4px 100% -6px 0)}
.ln.write{animation:penwrite var(--d,1s) cubic-bezier(.45,.05,.4,1) forwards}
@keyframes penwrite{from{clip-path:inset(-4px 100% -6px 0)}to{clip-path:inset(-4px -4px -6px 0)}}
.stage{position:relative;width:112px;height:78px;margin:92px auto 22px;perspective:800px;cursor:pointer;filter:drop-shadow(0 8px 14px #0005)}
.stage>*{position:absolute}
.env-back{inset:0;background:#e9a9bb;border-radius:6px}
.letter{left:9px;bottom:6px;width:94px;height:90px;background:linear-gradient(#fffdf8,#fbefe6);border-radius:6px;box-shadow:0 2px 8px #0003;text-align:center;padding-top:16px;z-index:2;transition:transform 1.1s cubic-bezier(.3,.8,.3,1)}
.letter-text{font:600 19px/1.1 var(--ff);color:#d2527c}
.env-front{inset:0;z-index:3;border-radius:6px;background:#f9dde5;border:1px solid #ea8aa3}
.env-front:after{content:"";position:absolute;inset:0;background:#dcb1bb;clip-path:polygon(0 100%,50% 42%,100% 100%);border-radius:6px}
.env-flap{left:0;top:0;width:100%;height:100%;z-index:4;background:#d56d87;clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:top center;border-radius:6px 6px 0 0}
.stage.open .env-flap{animation:flapOpen .55s ease forwards}
@keyframes flapOpen{0%{transform:rotateX(0);z-index:4}49%{z-index:4}50%{z-index:1}100%{transform:rotateX(180deg);z-index:1;background:#c75b78}}
.stage.open .letter{transform:translateY(-66px);transition-delay:.45s}
.buka{font-style:italic;font-size:22px;padding:4px 26px;border:1.5px solid #ffffffcc;background:#d56d87}
.buka:disabled{opacity:.7}
.hrt{position:absolute;bottom:-40px;color:#ff3b62;line-height:1;animation:rise linear infinite;will-change:transform}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(.7);opacity:0}10%{opacity:.9}100%{transform:translate3d(var(--dx),-115vh,0) scale(1.1);opacity:0}}
#hearts.pause .hrt{animation-play-state:paused}
#mute{position:fixed;z-index:5;top:12px;right:12px;width:38px;height:38px;padding:0;border-radius:50%;font-size:17px;background:rgba(10,20,40,.55);border:1px solid #ffffff55;box-shadow:none}
@media(max-height:650px){main{padding:10px}.avatar{width:70px;height:70px;margin-bottom:10px}.card{padding:18px 16px}}
</style>
</head>
<body>
<div id="bubbles"></div><div id="hearts"></div>
<button id="mute" aria-label="Musik">🔇</button>
<main>
  <section class="screen active opening" id="s1">
    <div class="stage" id="stage" onclick="bukaClick()">
      <div class="env-back"></div>
      <div class="letter"><div class="letter-text" id="letterText">Halo Humai
cantik 💗</div></div>
      <div class="env-front"></div><div class="env-flap"></div>
    </div>
    <button class="buka" id="bukaBtn" onclick="bukaClick()">Buka</button>
  </section>

  <section class="screen" id="s2"><div class="card">
    <img class="avatar" src="https://files.catbox.moe/jmog32.webp" alt="Foto" onerror="this.onerror=null;this.src='https://files.catbox.moe/m70kkw.gif'">
    <div class="question">8 + 2</div><div class="sub">Berapa ya? 🤔</div>
    <button onclick="go('s3')">Lanjut 💗</button>
  </div></section>

  <section class="screen" id="s3"><div class="card">
    <h1>Coba Jumlahin Yaa 😆</h1>
    <div class="calculator">
      <div id="display">0</div>
      <div class="keys">
        <button class="operator span2" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="input('/')">/</button>
        <button class="equal" onclick="calculate()">=</button>
        <button onclick="input('7')">7</button><button onclick="input('8')">8</button><button onclick="input('9')">9</button><button class="operator" onclick="input('-')">-</button>
        <button onclick="input('4')">4</button><button onclick="input('5')">5</button><button onclick="input('6')">6</button><button class="operator" onclick="input('*')">×</button>
        <button onclick="input('1')">1</button><button onclick="input('2')">2</button><button onclick="input('3')">3</button><button class="operator" onclick="input('+')">+</button>
        <button class="span2" onclick="input('0')">0</button><button onclick="input('.')">.</button><button class="operator" onclick="percentKey()">%</button>
      </div>
    </div>
    <div class="small-note" id="note">Masukkan jawaban dari 8 + 2 yaa 💕</div>
  </div></section>

  <section class="screen" id="s4"><div class="card">
    <span class="flag">💌</span>
    <img class="avatar" src="https://files.catbox.moe/m70kkw.gif" alt="Foto kedua">
    <div class="result-line">i love youuu <span id="percent">0%</span> 💗</div>
    <button id="continue" onclick="go('s5')" style="display:none">Lanjut 💗</button>
  </div></section>

  <section class="screen" id="s5"><div class="card">
    <span class="flag">💌</span>
    <img class="avatar" src="https://files.catbox.moe/m70kkw.gif" alt="Foto kedua">
    <div class="result-line">i love youuu Humai💗</div>
    <div class="msg" id="message"></div>
  </div></section>
</main>

/* ---- Musik: ditanam di file, mulai saat sentuhan pertama ---- */
const bgm=new Audio(),muteBtn=document.getElementById('mute');
bgm.loop=true;bgm.volume=.7;let loaded=false,want=true;
function loadMusic(){
  if(loaded)return;loaded=true;
  const b=atob(MUSIC_B64),u=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  bgm.src=URL.createObjectURL(new Blob([u],{type:'audio/mpeg'}));
}
function playMusic(){
  loadMusic();
  const p=bgm.play();
  if(p&&p.then)p.then(()=>{muteBtn.textContent='🔊'}).catch(()=>{muteBtn.textContent='🔇'});
}
function firstTap(e){
  if(e.target.closest&&e.target.closest('#mute'))return;
  if(want&&bgm.paused)playMusic();
  if(!bgm.paused)['pointerdown','touchend','click'].forEach(n=>removeEventListener(n,firstTap,true));
}
['pointerdown','touchend','click'].forEach(n=>addEventListener(n,firstTap,true));
muteBtn.onclick=()=>{
  if(bgm.paused){want=true;playMusic()}else{want=false;bgm.pause();muteBtn.textContent='🔇'}
};
document.addEventListener('visibilitychange',()=>{
  document.getElementById('hearts').classList.toggle('pause',document.hidden);
  if(document.hidden)bgm.pause();else if(want&&loaded)playMusic();
});

/* ---- Gelembung ---- */
const bubbleBox=document.getElementById('bubbles');
for(let i=0;i<5;i++){
  const b=document.createElement('i'),s=14+Math.random()*34;
  b.className='bubble';
  b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${-Math.random()*10}s;animation-duration:${8+Math.random()*7}s`;
  bubbleBox.appendChild(b);
}

/* ---- Tulisan tangan (efek menulis per baris) ---- */
function writeInto(box,startDelay){
  if(box.dataset.done)return 0;box.dataset.done=1;
  const lines=box.textContent.split('\n');box.textContent='';
  let t=startDelay||300;
  lines.forEach(l=>{
    const d=document.createElement('span');d.className='ln';d.textContent=l;box.appendChild(d);
    if(!l.trim())return;
    const dur=Math.max(450,l.length*62);
    d.style.setProperty('--d',dur+'ms');
    setTimeout(()=>d.classList.add('write'),t);t+=dur+200;
  });
  return t;
}

  document.getElementById(id).classList.add('active');
  if(id==='s4')animatePercent();
  if(id==='s5'){const m=document.getElementById('message');m.textContent=PANTUN;writeInto(m,500);startHearts(10)}
}
function go(id){
  if(busy)return;
  const cur=document.querySelector('.screen.active');
  if(!cur||cur.id===id){show(id);return}
  busy=true;cur.classList.remove('active');cur.classList.add('leaving');
  setTimeout(()=>{cur.classList.remove('leaving');show(id);busy=false},420);
}

/* ---- Kalkulator ---- */
let expression='',replyTimer=null;
const display=document.getElementById('display'),note=document.getElementById('note');
function render(){display.classList.remove('reply');display.textContent=expression||'0'}
function say(t,ms,after){
  clearTimeout(replyTimer);display.classList.add('reply');display.textContent=t;
  replyTimer=setTimeout(()=>{if(after)after();else render()},ms||1400);
}
function input(v){
  if(display.classList.contains('reply')){clearTimeout(replyTimer);expression=''}
  if(expression.length>=16)return;
  if(/[+\-*/.]$/.test(expression)&&/[+\-*/.]/.test(v))return;
  expression+=v;render();
}
function clearDisplay(){clearTimeout(replyTimer);expression='';render()}
function percentKey(){say('i love youuu 💗',1200,()=>{expression='';render()})}
const wrong=['Belum tepat 🤭 coba lagi','Hmm kurang pas 😆','Ayo dong, coba lagi 💗','Dikit lagi kok 🥺','Hitung pake hati ya 💕'];
let wi=0;
function calculate(){
  if(!expression)return;
  if(!/^[0-9+\-*/.() ]+$/.test(expression)){clearDisplay();return}
  let r;
  try{r=Function('"use strict";return ('+expression+')')()}catch(e){expression='';say('Error 😅',900);return}
  expression='';
  if(!Number.isFinite(r)){say('Error 😅',900);return}
  if(Math.abs(r-10)<1e-6)say('i love youuu 10% 💗',1500,()=>go('s4'));
  else{say(wrong[wi++%wrong.length],1500);note.textContent='Belum tepat, coba lagi yaa 💗'}
}

/* ---- Persen ---- */
function animatePercent(){
  const el=document.getElementById('percent'),btn=document.getElementById('continue');
  btn.style.display='none';let n=0;
  const t=setInterval(()=>{n++;el.textContent=n+'%';if(n>=100){clearInterval(t);btn.style.display='inline-block'}},35);
}

/* ---- Hati (ringan: 10 saja, hanya transform + opacity) ---- */
let heartsOn=false;
function startHearts(n){
  if(heartsOn)return;heartsOn=true;
  const box=document.getElementById('hearts');
  for(let i=0;i<n;i++){
    const h=document.createElement('div');h.className='hrt';h.textContent='❤';
    h.style.cssText=`left:${Math.random()*100}%;font-size:${16+Math.random()*20}px;--dx:${(Math.random()*60-30)|0}px;animation-duration:${6+Math.random()*5}s;animation-delay:${-Math.random()*9}s`;
    box.appendChild(h);
  }
}

/* ---- Amplop ---- */
let opened=false;
function openLetter(){
  if(opened)return;opened=true;
  const btn=document.getElementById('bukaBtn');btn.disabled=true;
  document.getElementById('stage').classList.add('open');
  const end=writeInto(document.getElementById('letterText'),1700);
  setTimeout(()=>{btn.disabled=false;btn.textContent='Lanjut 💗'},end+200);
}
function bukaClick(){if(!opened)openLetter();else if(!document.getElementById('bukaBtn').disabled)go('s2')}
</script>
